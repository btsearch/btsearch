name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build packages/drizzle
        run: pnpm --filter @openbts/drizzle build
      - name: Build packages/shared
        run: pnpm --filter @openbts/shared build
      - name: Build packages/country-packs
        run: pnpm --filter @openbts/country-packs build
      - name: Build apps/server
        run: pnpm --filter @openbts/sora build
      - name: Build apps/client
        run: pnpm --filter @openbts/client build

  server-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test apps/server
        run: pnpm --filter @openbts/sora test

  engine:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: openbts
          POSTGRES_PASSWORD: openbts
          POSTGRES_DB: openbts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbts -d openbts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build packages/drizzle
        run: pnpm --filter @openbts/drizzle build
        working-directory: .
      - name: Build packages/shared
        run: pnpm --filter @openbts/shared build
        working-directory: .
      - name: Build the engine's test database from the migrations
        working-directory: packages/drizzle
        env:
          DATABASE_URL: postgres://openbts:openbts@localhost:5432/openbts
        run: node dist/migrate.js
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Test the engine
        env:
          ENGINE_TEST_DATABASE_URL: postgres://openbts:openbts@localhost:5432/openbts
        run: cargo test --locked

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: openbts
          POSTGRES_PASSWORD: openbts
          POSTGRES_DB: openbts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbts -d openbts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build packages/drizzle
        run: pnpm --filter @openbts/drizzle build
      - name: Build packages/shared
        run: pnpm --filter @openbts/shared build
      - name: Apply every migration to an empty database
        working-directory: packages/drizzle
        env:
          DATABASE_URL: postgres://openbts:openbts@localhost:5432/openbts
        run: node dist/migrate.js
