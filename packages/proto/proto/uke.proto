syntax = "proto3";
import "common.proto";
import "locations.proto";
import "google/protobuf/wrappers.proto";
package openbts.uke;

message UKEOperator {
  int32 id = 1;
  string name = 2;
  string full_name = 3;
}

enum DecisionType {
  DECISION_TYPE_UNKNOWN = 0;
  P = 1;
  zmP = 2;
}

enum PermitSource {
  PERMIT_SOURCE_UNKNOWN = 0;
  permits = 1;
  device_registry = 2;
}

enum AntennaType {
  ANTENNA_TYPE_UNKNOWN = 0;
  indoor = 1;
  outdoor = 2;
}

message Sector {
  int32 id = 1;
  google.protobuf.Int32Value azimuth = 2;
  google.protobuf.Int32Value elevation = 3;
  google.protobuf.Int32Value antenna_height = 4;
  AntennaType antenna_type = 5;
}

message UKEStation {
  int32 id = 1;
  string station_id = 2;
  openbts.locations.Location location = 3;
  Operator operator = 4;

  string updatedAt = 5;
  string createdAt = 6;
}

message Permit {
  int32 id = 1;
  string decision_number = 2;
  DecisionType decision_type = 3;
  string expiry_date = 4;
  PermitSource source = 5;
  UKEStation station = 6;
  Band band = 7;
  repeated Sector sectors = 8;

  string updatedAt = 9;
  string createdAt = 10;
}

message StationPermit {
  int32 id = 1;
  string decision_number = 2;
  DecisionType decision_type = 3;
  string expiry_date = 4;
  PermitSource source = 5;
  Band band = 6;
  repeated Sector sectors = 7;

  string updatedAt = 8;
  string createdAt = 9;
}

message UKELocationStation {
  int32 id = 1;
  string station_id = 2;
  Operator operator = 3;
  repeated StationPermit permits = 4;

  string updatedAt = 5;
  string createdAt = 6;
}

message UKELocation {
  int32 id = 1;
  string city = 2;
  string address = 3;
  double latitude = 4;
  double longitude = 5;
  Region region = 6;
  repeated UKELocationStation stations = 7;

  string updatedAt = 8;
  string createdAt = 9;
}

message RadiolineManufacturer {
  int32 id = 1;
  string name = 2;
}

message EquipmentType {
  int32 id = 1;
  string name = 2;
  RadiolineManufacturer manufacturer = 3;
}

message RadiolineAtenna {
  EquipmentType type = 1;
  double gain = 2;
  double height = 3;
}

message RadiolineTxTransmitter {
  EquipmentType type = 1;
}

message RadiolineTx {
  double longitude = 1;
  double latitude = 2;
  double height = 3;
  double eirp = 4;
  double antenna_attenuation = 5;
  RadiolineTxTransmitter transmitter = 6;
  RadiolineAtenna antenna = 7;
}

message RadiolineRx {
  double longitude = 1;
  double latitude = 2;
  double height = 3;
  EquipmentType type = 4;
  double gain = 5;
  double height_antenna = 6;
  double noise_figure = 7;
  double atpc_attenuation = 8;
}

message RadiolineLink {
  double freq = 1;
  google.protobuf.Int32Value ch_num = 2;
  string plan_synbol = 3;
  double ch_width = 4;
  string polarization = 5;
  string plan_symbol = 6;
  string modulation_type = 7;
  string bandwidth = 8;
}

message RadiolinePermit {
  string number = 1;
  string decision_type = 2;
  string expiry_date = 3;
}

message Radioline {
  int32 id = 1;
  RadiolineTx tx = 2;
  RadiolineRx rx = 3;
  RadiolineLink link = 4;
  UKEOperator operator = 5;
  RadiolinePermit permit = 6;

  string updatedAt = 7;
  string createdAt = 8;
}

message PermitsResponse {
  repeated Permit data = 1;
}

message PermitResponse {
  Permit data = 1;
}

message LocationsResponse {
  repeated UKELocation data = 1;
  int32 totalCount = 2;
}

message RadiolinesResponse {
  repeated Radioline data = 1;
  int32 totalCount = 3;
}

message RadiolineResponse {
  Radioline data = 1;
}
