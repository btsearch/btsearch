packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  bufferutil: true
  core-js: true
  esbuild: true
  exifreader: true
  msw: true
  sharp: true

resolutionMode: "highest"
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - si2pem-reader@0.4.4
  - "@btsearch/rf-engine@0.1.9"
  - "@btsearch/rf-engine-win32-x64-msvc@0.1.9"
  - "@btsearch/rf-engine-darwin-x64@0.1.9"
  - "@btsearch/rf-engine-darwin-arm64@0.1.9"
  - "@btsearch/rf-engine-linux-x64-gnu@0.1.9"
  - "@btsearch/rf-engine-linux-arm64-gnu@0.1.9"
  - "@btsearch/rf-engine-linux-arm64-musl@0.1.9"
  - maplibre-gl@6.7.0
  - "@better-auth/api-key@1.7.16"
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/oauth-provider@1.7.16"
  - "@better-auth/passkey@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-auth@1.7.16
  - better-call@1.4.5
